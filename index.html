<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Diary</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 30px 20px;
            text-align: center;
            background: #faf7ff;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 14px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        #newEntry {
            background: #6c4ab6;
            color: white;
        }

        #editor {
            display: none;
            margin-top: 25px;
        }

        textarea {
            width: 100%;
            height: 220px;
            box-sizing: border-box;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 12px;
            font-size: 16px;
            resize: vertical;
        }

        #saveEntry {
            background: #333;
            color: white;
        }
    </style>
</head>

<body>
    <h1>📔 My Diary</h1>
    <p>Welcome to your little space.</p>

    <button id="newEntry" onclick="openEditor()">➕ Write a new entry</button>

    <div id="editor">
        <textarea id="entryText" placeholder="Write whatever is on your mind..."></textarea>
        <br>
        <button id="saveEntry" onclick="saveEntry()">💾 Save Entry</button>
    </div>

    <script>
        function openEditor() {
            document.getElementById("editor").style.display = "block";
            document.getElementById("entryText").focus();
        }

        function saveEntry() {
            const text = document.getElementById("entryText").value;

            if (text.trim() === "") {
                alert("Your diary entry is empty! 🥺");
                return;
            }

            localStorage.setItem("myDiaryEntry", text);
            alert("Entry saved! 📔✨");
        }
    </script>
</body>
</html>
